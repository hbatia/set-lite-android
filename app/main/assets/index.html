<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>סט</title>
<meta name="theme-color" content="#F6F2EB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root{--page:#F6F2EB;--ink:#3B3733;--soft:#8A837C;--line:#E4DCCE;--accent:#7D2CB5}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--page);color:var(--ink);
    height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding:6px;-webkit-tap-highlight-color:transparent}
  header{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px;flex:0 0 auto}
  h1{font-size:20px;font-weight:800;letter-spacing:.5px}
  .stats{display:flex;gap:5px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px 8px;text-align:center;min-width:48px}
  .stat b{display:block;font-size:8px;color:var(--soft);letter-spacing:.5px}
  .stat span{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat.t span{color:var(--accent)}
  .board{flex:1 1 auto;min-height:0;display:grid;gap:4px;justify-content:center;align-content:center;margin-bottom:6px}
  .card{background:#fff;border:1px solid rgba(60,48,40,.14);border-radius:9px;overflow:hidden;display:flex;
    align-items:center;justify-content:center;padding:6%;min-height:0}
  .card svg{width:100%;height:100%;display:block}
  .card.sel{box-shadow:inset 0 0 0 2.5px var(--ink)}
  .card.ok{animation:pop .35s ease}
  .card.no{animation:sh .3s ease}
  .card.hi{box-shadow:inset 0 0 0 2.5px var(--accent)}
  @keyframes pop{45%{transform:scale(1.08)}}
  @keyframes sh{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .ctrls{display:flex;gap:6px;justify-content:center;flex:0 0 auto}
  button.b{font-family:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);
    border-radius:10px;padding:9px 12px;flex:1;max-width:120px}
  button.b:active{background:#efe6f6;border-color:var(--accent);color:var(--accent)}
  .msg{position:fixed;inset-inline:0;bottom:10px;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:#fff;
    padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
  .msg.on{opacity:1}
  .over{position:fixed;inset:0;background:rgba(50,40,34,.5);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:.2s}
  .over.on{opacity:1;pointer-events:auto}
  .box{background:var(--page);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center;max-width:220px;width:100%}
  .box h2{font-size:20px;font-weight:800;margin-bottom:10px}
  .box .row{display:flex;gap:14px;justify-content:center;margin-bottom:14px}
  .box .n{font-size:22px;font-weight:800;color:var(--accent)}
  .box .l{font-size:9px;color:var(--soft)}
  .box button{font-family:inherit;font-size:14px;font-weight:600;border:none;background:var(--accent);color:#fff;border-radius:10px;padding:10px 18px;width:100%}
</style>
</head>
<body>
  <header>
    <h1>סט</h1>
    <div class="stats">
      <div class="stat"><b>סטים</b><span id="score">0</span></div>
      <div class="stat t"><b>זמן</b><span id="clock">0:00</span></div>
      <div class="stat"><b>שיא</b><span id="best">—</span></div>
    </div>
  </header>
  <div class="board" id="board"></div>
  <div class="ctrls">
    <button class="b" id="noset">אין סט</button>
    <button class="b" id="hint">רמז</button>
    <button class="b" id="new">חדש</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="over" id="over"><div class="box">
    <h2 id="ot">סיימתם!</h2>
    <div class="row"><div><div class="n" id="os">0</div><div class="l">סטים</div></div><div><div class="n" id="om">0:00</div><div class="l">זמן</div></div></div>
    <button id="again">משחק חדש</button>
  </div></div>

<script>
var C=['#E12D22','#7D2CB5','#1E9E48'];  // אדום · סגול · ירוק
var SQ="M 90.9,0.0 L 87.1,0.8 L 83.6,2.6 L 80.2,4.6 L 76.8,6.4 L 73.2,8.1 L 69.5,9.3 L 65.7,10.0 L 61.8,10.2 L 57.9,9.8 L 54.1,8.9 L 50.4,7.5 L 46.8,6.2 L 43.0,5.0 L 39.3,4.0 L 35.4,3.3 L 31.5,3.1 L 27.6,3.1 L 23.7,3.6 L 19.9,4.5 L 16.3,5.9 L 12.8,7.7 L 9.7,10.0 L 7.0,12.9 L 4.8,16.1 L 2.9,19.5 L 1.5,23.2 L 0.6,27.0 L 0.1,30.8 L 0.0,34.7 L 0.2,38.7 L 1.0,42.5 L 2.7,46.0 L 5.4,48.8 L 9.1,50.0 L 12.9,49.2 L 16.4,47.4 L 19.8,45.4 L 23.2,43.6 L 26.8,41.9 L 30.5,40.7 L 34.3,40.0 L 38.2,39.8 L 42.1,40.2 L 45.9,41.1 L 49.6,42.5 L 53.2,43.8 L 57.0,45.0 L 60.7,46.0 L 64.6,46.7 L 68.5,46.9 L 72.4,46.9 L 76.3,46.4 L 80.1,45.5 L 83.7,44.1 L 87.2,42.3 L 90.3,40.0 L 93.0,37.1 L 95.2,33.9 L 97.1,30.5 L 98.5,26.8 L 99.4,23.0 L 99.9,19.2 L 100.0,15.3 L 99.8,11.3 L 99.0,7.5 L 97.3,4.0 L 94.6,1.2 Z";
function shapeEl(sh,st){
  if(sh===0) return '<polygon points="50,0.6 99.4,25 50,49.4 0.6,25" '+st+' stroke-linejoin="round"/>';
  if(sh===1) return '<rect x="0.6" y="0.6" width="98.8" height="48.8" rx="24.4" ry="24.4" '+st+'/>';
  return '<path d="'+SQ+'" '+st+' stroke-linejoin="round"/>';
}
var uid=0;
function cardSVG(c){
  var col=C[c.color], n=c.count+1, sw=100, sh=50, gap=16, vbW=112, vbH=196, x=(vbW-sw)/2, tot=n*sh+(n-1)*gap, sy=(vbH-tot)/2;
  var pid='p'+(uid++), defs='', st;
  if(c.fill===0) st='fill="'+col+'" stroke="'+col+'" stroke-width="1"';
  else if(c.fill===1) st='fill="none" stroke="'+col+'" stroke-width="1.3"';
  else{ st='fill="url(#'+pid+')" stroke="'+col+'" stroke-width="1.1"';
    defs='<defs><pattern id="'+pid+'" width="4.4" height="4" patternUnits="userSpaceOnUse"><line x1="1" y1="0" x2="1" y2="4" stroke="'+col+'" stroke-width="0.8"/></pattern></defs>'; }
  var body='';
  for(var i=0;i<n;i++) body+='<g transform="translate('+x+','+(sy+i*(sh+gap))+')">'+shapeEl(c.shape,st)+'</g>';
  return '<svg viewBox="0 0 '+vbW+' '+vbH+'" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">'+defs+body+'</svg>';
}

var deck=[],board=[],sel=[],score=0,seconds=0,timer=null,started=false,locked=false,best=null,hSet=null,hPick=null;
var AR=112/196;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0;var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function buildDeck(){var d=[];for(var c=0;c<3;c++)for(var s=0;s<3;s++)for(var f=0;f<3;f++)for(var n=0;n<3;n++)d.push({color:c,shape:s,fill:f,count:n});return shuffle(d);}
function isSet(a,b,c){var k=['color','shape','fill','count'];for(var i=0;i<4;i++)if((a[k[i]]+b[k[i]]+c[k[i]])%3)return false;return true;}
function findSet(a){for(var i=0;i<a.length-2;i++)for(var j=i+1;j<a.length-1;j++)for(var k=j+1;k<a.length;k++)if(isSet(a[i],a[j],a[k]))return [i,j,k];return null;}
function findAll(a){var r=[];for(var i=0;i<a.length-2;i++)for(var j=i+1;j<a.length-1;j++)for(var k=j+1;k<a.length;k++)if(isSet(a[i],a[j],a[k]))r.push([i,j,k]);return r;}

function fmt(s){return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);}
function tick(){if(timer)return;timer=setInterval(function(){seconds++;document.getElementById('clock').textContent=fmt(seconds);},1000);}
function stop(){clearInterval(timer);timer=null;}

function layout(){
  var b=document.getElementById('board');
  var cols=Math.max(4,Math.ceil(board.length/3)),rows=Math.max(1,Math.ceil(board.length/cols));
  var g=parseFloat(getComputedStyle(b).gap)||4,bw=b.clientWidth,bh=b.clientHeight;
  if(bw<=0||bh<=0)return;
  var cw=(bw-(cols-1)*g)/cols, ch=(bh-(rows-1)*g)/rows;
  var cardH=Math.min(ch,cw/AR), cardW=cardH*AR;
  b.style.gridTemplateColumns='repeat('+cols+', '+cardW+'px)';
  b.style.gridAutoRows=cardH+'px';
}
function render(){
  var b=document.getElementById('board');b.innerHTML='';
  for(var i=0;i<board.length;i++){(function(i){
    var el=document.createElement('div');
    el.className='card'+(sel.indexOf(i)>=0?' sel':'');
    el.innerHTML=cardSVG(board[i]);
    el.onclick=function(){pick(i);};
    b.appendChild(el);
  })(i);}
  layout();
  document.getElementById('score').textContent=score;
}

function pick(i){
  if(locked)return;
  if(!started){started=true;tick();}
  var at=sel.indexOf(i);
  if(at>=0){sel.splice(at,1);render();return;}
  if(sel.length===3)return;
  sel.push(i);render();
  if(sel.length===3)ev();
}
function ev(){
  var i=sel[0],j=sel[1],k=sel[2];
  if(isSet(board[i],board[j],board[k])){
    locked=true;score++;document.getElementById('score').textContent=score;
    var nodes=document.getElementsByClassName('card');
    for(var s=0;s<sel.length;s++)if(nodes[sel[s]])nodes[sel[s]].className+=' ok';
    var slots=sel.slice().sort(function(a,b){return a-b;});
    setTimeout(function(){
      if(board.length>12){slots.slice().sort(function(a,b){return b-a;}).forEach(function(x){board.splice(x,1);});}
      else{slots.forEach(function(x){board[x]=deck.length?deck.pop():null;});board=board.filter(Boolean);}
      sel=[];locked=false;render();over();
    },380);
  }else{
    locked=true;
    var nodes=document.getElementsByClassName('card');
    for(var s=0;s<sel.length;s++)if(nodes[sel[s]])nodes[sel[s]].className+=' no';
    setTimeout(function(){sel=[];locked=false;render();},320);
  }
}
function onNoSet(){
  if(locked)return;
  if(findSet(board)){msg('קיים סט');return;}
  if(deck.length===0){over();return;}
  if(!started){started=true;tick();}
  var add=Math.min(3,deck.length);for(var n=0;n<add;n++)board.push(deck.pop());
  sel=[];render();msg('נוספו 3 קלפים');
}
function hint(){
  if(locked)return;
  var sets=findAll(board);
  if(!sets.length){msg('אין סט — לחצו "אין סט"');return;}
  var idx;
  if(hSet&&hPick&&hSet.every(function(c){return board.indexOf(c)>=0;})&&board.indexOf(hPick)>=0){idx=board.indexOf(hPick);}
  else{var st=sets[Math.random()*sets.length|0];hSet=st.map(function(x){return board[x];});hPick=hSet[Math.random()*3|0];idx=board.indexOf(hPick);}
  var el=document.getElementsByClassName('card')[idx];
  if(el){el.className+=' hi';setTimeout(function(){el.className=el.className.replace(' hi','');},1100);}
}
function over(){
  if(deck.length===0&&!findSet(board)){
    stop();
    if(score>0&&(best===null||seconds<best)){best=seconds;try{localStorage.setItem('set_lite_best',best);}catch(e){}updBest();}
    document.getElementById('os').textContent=score;
    document.getElementById('om').textContent=fmt(seconds);
    document.getElementById('ot').textContent=score>0?'סיימתם!':'נגמר';
    document.getElementById('over').className='over on';
  }
}
function updBest(){document.getElementById('best').textContent=best!==null?fmt(best):'—';}
function loadBest(){try{var v=localStorage.getItem('set_lite_best');best=v!==null?parseInt(v,10):null;}catch(e){best=null;}updBest();}

var mt=null;
function msg(t){var m=document.getElementById('msg');m.textContent=t;m.className='msg on';clearTimeout(mt);mt=setTimeout(function(){m.className='msg';},1600);}

function newGame(){
  stop();deck=buildDeck();board=[];sel=[];score=0;seconds=0;started=false;locked=false;hSet=null;hPick=null;
  for(var n=0;n<12;n++)board.push(deck.pop());
  document.getElementById('clock').textContent='0:00';
  document.getElementById('over').className='over';
  render();
}
document.getElementById('noset').onclick=onNoSet;
document.getElementById('hint').onclick=hint;
document.getElementById('new').onclick=newGame;
document.getElementById('again').onclick=newGame;
window.addEventListener('resize',layout);

// אייקון להוספה למסך הבית — מוטמע, עובד בלי אינטרנט
try{
  var svg="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='#F4EEE4'/><rect x='26' y='16' width='48' height='68' rx='7' fill='#fff' stroke='#E8DFCF'/><polygon points='50,27 70,35 50,43 30,35' fill='#E12D22'/><ellipse cx='50' cy='50' rx='20' ry='8' fill='#7D2CB5'/><rect x='30' y='59' width='40' height='15' rx='7' fill='#1E9E48'/></svg>";
  var man={name:'סט',short_name:'סט',display:'standalone',orientation:'portrait',background_color:'#F6F2EB',theme_color:'#F6F2EB',start_url:'.',icons:[{src:"data:image/svg+xml,"+encodeURIComponent(svg),sizes:'any',type:'image/svg+xml'}]};
  var bl=new Blob([JSON.stringify(man)],{type:'application/json'});
  var lk=document.createElement('link');lk.rel='manifest';lk.href=URL.createObjectURL(bl);document.head.appendChild(lk);
  var ai=document.createElement('link');ai.rel='apple-touch-icon';ai.href="data:image/svg+xml,"+encodeURIComponent(svg);document.head.appendChild(ai);
}catch(e){}

loadBest();newGame();
</script>
</body>
</html>
